[workspace]
members = [
    "crates/nexus-core",
    "crates/nexus-ledger",
    "crates/nexus-reports",
    "crates/nexus-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["rick walker <xuoxod@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/xuoxod/nexus-recon"
homepage = "https://github.com/xuoxod/nexus-recon"
description = "Air-Gapped Subnet Incident Commander & Network Operations Cockpit"
readme = "README.md"
keywords = ["recon", "network-scanner", "incident-response", "trie", "forensics"]
categories = ["command-line-utilities", "network-programming", "security-tools"]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
ipnet = "2.9"
